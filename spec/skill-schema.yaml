# 3D Agent Skills Specification

version: 1

skill:
  name: string
  description: string
  role: string
  category: string
  software:
    - blender

metadata:
  level: junior|mid|senior|expert
  dependencies: []
  # description is REQUIRED: harness loaders (Claude Code, OpenCode, Codex)
  # filter out skills without a "Use when..." description.
  # name MUST equal the SKILL.md parent folder name.
  compatible_harness:
    - claude-code
    - codex
    - opencode
    - cursor
    - cline
    - roo-code

workflow:
  phases:
    - name: string
      actions: []

quality:
  checks:
    - string

principles:
  - production_ready
  - reference_driven
  - iterative_review
